name: lg_interactive_onboarding
description: "LG Content Studio – Create KML content for Liquid Galaxy"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.2.1

  # SSH
  dartssh2: ^2.13.0

  # Persistence
  shared_preferences: ^2.5.4

  # Theming / Fonts
  google_fonts: ^8.0.1


  # File picking
  file_picker: ^8.1.0

  # OpenStreetMap (no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1


  # XML parsing (DAE, KML)
  xml: ^6.5.0

  # Path utilities
  path: ^1.9.0

  # Temp directory for asset extraction
  path_provider: ^2.1.5

  # Archive handling (KMZ)
  archive: ^4.0.4
  flutter_secure_storage: ^10.3.1

  # SVG rendering (Architecture Explorer diagrams)
  flutter_svg: ^2.0.10+1

  # Text-to-speech (voice narration for guided mode & Architecture Explorer)
  flutter_tts: ^3.8.0

  # HTTP client (AI Mentor → Firebase Cloud Function)
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1
  speech_to_text: ^7.4.0
  permission_handler: ^12.0.3
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/models/3dmodel_tri.dae
    - assets/models/Ball DAE.dae
    - assets/models/Car.dae
    - assets/models/model_pyramid.dae
    - assets/scripts/dae_triangulate.py
    - assets/logos/logo_banner.png
    - assets/logos/apk_logo.png
    - assets/knowledge/
    - assets/kml_icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/apk_logo.png"
