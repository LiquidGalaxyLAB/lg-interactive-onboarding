name: lg_interactive_onboarding
description: "LG Content Studio – Create KML content for Liquid Galaxy"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.3.6
  dartssh2: ^2.2.0
  shared_preferences: ^2.2.0

  # State management
  flutter_riverpod: ^3.2.1

  # SSH
  dartssh2: ^2.13.0

  # Persistence
  shared_preferences: ^2.5.4

  # Theming / Fonts
  google_fonts: ^8.0.1


  # File picking
  file_picker: ^8.1.0

  # OpenStreetMap (no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # 3D model preview
  model_viewer_plus: ^1.8.2

  # XML parsing (DAE, KML)
  xml: ^6.5.0

  # Path utilities
  path: ^1.9.0

  # Temp directory for asset extraction
  path_provider: ^2.1.5

  # Archive handling (KMZ)
  archive: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/3dmodel_tri.dae
    - assets/models/car_tri.dae
    - assets/models/model_pyramid.dae
    - assets/scripts/dae_triangulate.py
